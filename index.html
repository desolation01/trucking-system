<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FastHaul Ops — trucking service management: trips, fleet, employees, payroll and commissions." />
    <meta name="theme-color" content="#0b0f19" />
    <meta name="color-scheme" content="light dark" />
    <title>FastHaul Ops — Trucking Management</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("fasthaul.theme");
          var dark = saved ? saved === "dark" : !window.matchMedia("(prefers-color-scheme: light)").matches;
          document.documentElement.classList.toggle("dark", dark);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#0b0f19" : "#f5f6f8");
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
