name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Bundle secret scan
        run: |
          if grep -rE "(sbp_[A-Za-z0-9]{20,}|service_role)" dist/assets/; then
            echo "::error::Service-role credential pattern found in client bundle"
            exit 1
          fi
          echo "Bundle clean: no service-role tokens"
